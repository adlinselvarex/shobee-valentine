<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Shobee ❤️</title>

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ff0844 0%, #ffb199 100%);
      min-height: 100vh;
      color: white;
      text-align: center;
    }

    /* DARK END */
    .darkMode {
      background: #1a0010 !important;
    }

    /* LOGIN */
    #lockScreen {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: url('valentine3.jpg') no-repeat center center;
      background-size: cover;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30000;
    }

    input {
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 18px;
      width: 70%;
      max-width: 260px;
    }

    .openBtn {
      margin-top: 20px;
      padding: 18px 40px;
      font-size: 20px;
      background: white;
      color: #ff1744;
      border: none;
      border-radius: 50px;
    }

    /* HEART FLOAT */
    .heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* BACKGROUND LOVE IMAGES */
    .bgLove {
      position: fixed;
      width: 240px;
      opacity: 0.95;
      z-index: 40000;
      pointer-events: none;
    }

    .leftLove {
      bottom: 0;
      left: 0;
    }

    .rightLove {
      bottom: 0;
      right: 0;
    }

    /* MAIN BOX */
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      max-width: 480px;
      background: rgba(0, 0, 0, 0.75);
      padding: 30px;
      border-radius: 22px;
      z-index: 20000;
      /* Text on top of everything */
    }

    /* TITLE */
    h1 {
      font-size: 1.9rem;
    }

    /* BUTTONS */
    .buttons {
      margin-top: 30px;
      height: 160px;
      position: relative;
    }

    #yesBtn {
      font-size: 1.6rem;
      padding: 16px 38px;
      background: #ff1744;
      color: white;
      border: none;
      border-radius: 40px;
      cursor: pointer;
    }

    #yesBtn:disabled {
      background: #b33951;
      cursor: not-allowed;
      opacity: 0.7;
    }

    #noBtn {
      position: absolute;
      font-size: 1rem;
      padding: 10px 20px;
      background: white;
      color: #ff1744;
      border: none;
      border-radius: 40px;
    }

    /* PHOTOS */
    .photo {
      position: fixed;
      width: 140px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 1.6s ease;
      border: 2px solid rgba(255, 255, 255, 0.4);
      z-index: 15000;
      /* Above bg, below text */
    }

    /* INITIAL POSITIONS */
    .photo:nth-of-type(1) {
      top: 10%;
      left: 6%;
    }

    .photo:nth-of-type(2) {
      top: 70%;
      left: 12%;
    }

    .photo:nth-of-type(3) {
      top: 18%;
      left: 82%;
    }

    .photo:nth-of-type(4) {
      top: 65%;
      left: 78%;
    }

    .photo:nth-of-type(5) {
      top: 40%;
      left: 15%;
    }

    .photo:nth-of-type(6) {
      top: 30%;
      left: 60%;
    }

    /* TEXT */
    #successMsg {
      display: none;
      font-size: 1.8rem;
      margin-top: 15px;
    }

    #hiddenMsg {
      display: none;
      font-size: 1.5rem;
      margin-top: 10px;
    }

    #typing {
      display: none;
      font-size: 1.4rem;
      margin-top: 20px;
      white-space: pre-wrap;
      /* Maintain newlines in poem */
    }

    #finalLine {
      display: none;
      font-size: 2rem;
      margin-top: 25px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    /* MOBILE */
    @media(max-width:768px) {
      .photo {
        width: 90px;
      }

      .bgLove {
        width: 140px;
      }
    }
  </style>
</head>

<body>

  <!-- LOVE BACKGROUND IMAGES -->
  <img src="valentine1.jpg" class="bgLove leftLove">
  <img src="valentine2.jpg" class="bgLove rightLove">

  <!-- PASSWORD -->
  <div id="lockScreen">
    <h2>Enter Secret Password ❤️</h2>
    <input type="password" id="pass" placeholder="Password">
    <button class="openBtn" onclick="unlock()">OPEN ❤️</button>
  </div>

  <!-- MUSIC -->
  <audio id="bgMusic" loop autoplay>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <!-- PHOTOS -->
  <img src="photo1.jpg" class="photo" id="p1">
  <img src="photo2.jpg" class="photo" id="p2">
  <img src="photo3.jpg" class="photo" id="p3">
  <img src="photo4.jpg" class="photo" id="p4">
  <img src="photo5.jpg" class="photo" id="p5">
  <img src="photo6.jpg" class="photo" id="p6">

  <!-- MAIN -->
  <div class="container">
    <h1>Shobee Kutty, will you be my Valentine? ❤️</h1>

    <div class="buttons">
      <button id="yesBtn">YES 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div id="successMsg">💘 Yaaaay!!! 💘</div>
    <div id="hiddenMsg">Happy Valentine's Day Sweet Shobee ❤️</div>
    <div id="typing"></div>
    <div id="finalLine">Will you stay with me forever? ❤️</div>
  </div>

  <script>

    /* MUSIC START */
    function startMusic() {
      const music = document.getElementById("bgMusic");
      if (music.paused) {
        music.volume = 0.7;
        music.play().catch(() => {
          console.log("Autoplay blocked. Waiting for interaction.");
        });
      }
    }

    /* ATTEMPT AUTOPLAY & FOCUS */
    window.addEventListener('load', () => {
      startMusic();
      const p = document.getElementById("pass");
      if (p) p.focus();
    });
    document.addEventListener('click', startMusic);
    document.addEventListener('keydown', startMusic);

    /* PASSWORD */
    function unlock() {
      const entered = document.getElementById("pass").value.toLowerCase().trim();
      if (entered === "bajitos") {
        document.getElementById("lockScreen").style.display = "none";
        startMusic();
      } else {
        alert("Wrong password Bajitos!!! 😜");
      }
    }

    /* HEARTS */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "❤️";
      h.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6000);
    }, 400);

    /* NO FLOAT */
    const noBtn = document.getElementById("noBtn");
    noBtn.addEventListener("mouseover", () => {
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
      noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
    });

    /* YES CLICK */
    document.getElementById("yesBtn").addEventListener("click", (e) => {
      e.target.disabled = true; // Prevent multiple clicks
      document.getElementById("successMsg").style.display = "block";
      document.getElementById("hiddenMsg").style.display = "block";
      heartLayout();
      showPromise();
    });

    /* HEART LAYOUT */
    function heartLayout() {
      p1.style.top = "35%"; p1.style.left = "40%";
      p2.style.top = "25%"; p2.style.left = "50%";
      p3.style.top = "35%"; p3.style.left = "60%";
      p4.style.top = "50%"; p4.style.left = "45%";
      p5.style.top = "50%"; p5.style.left = "55%";
      p6.style.top = "60%"; p6.style.left = "50%";
    }

    /* PROMISE */
    function showPromise() {
      const text = `I promise to be your peace when the world feels heavy,
and your strength when your heart feels tired…
always, forever, yours — Shobee. ❤️`;

      const typingDiv = document.getElementById("typing");
      typingDiv.style.display = "block";

      let i = 0;
      function type() {
        if (i < text.length) {
          typingDiv.innerHTML += text.charAt(i);
          i++;
          setTimeout(type, 40);
        } else {
          setTimeout(() => {
            document.body.classList.add("darkMode");
            document.getElementById("finalLine").style.display = "block";
          }, 1500);
        }
      }
      type();
    }

  </script>

</body>

</html>
