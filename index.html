<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Shobee ❤️</title>

  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>❤️</text></svg>">

  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      overflow: hidden;
      background: linear-gradient(135deg, #ff0844, #ffb199);
      min-height: 100vh;
      color: white;
      text-align: center;
    }

    /* DARK MODE */
    .darkMode {
      background: #1a0010 !important;
      animation: bgPulse 3s infinite;
    }

    @keyframes bgPulse {
      0% {
        background: #1a0010;
      }

      50% {
        background: #2a0018;
      }

      100% {
        background: #1a0010;
      }
    }

    /* LOGIN */
    #lockScreen {
      position: fixed;
      width: 100%;
      height: 100vh;
      background: url('valentine3.jpg') center/cover no-repeat;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 30000;
    }

    input {
      padding: 14px;
      border: none;
      border-radius: 10px;
      margin-top: 12px;
      font-size: 18px;
      width: 70%;
      max-width: 260px;
    }

    .openBtn {
      margin-top: 20px;
      padding: 18px 40px;
      font-size: 20px;
      background: white;
      color: #ff1744;
      border: none;
      border-radius: 50px;
    }

    /* HEART FLOAT */
    .heart {
      position: fixed;
      bottom: -20px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      from {
        transform: translateY(0);
        opacity: 1;
      }

      to {
        transform: translateY(-110vh);
        opacity: 0;
      }
    }

    /* BACKGROUND LOVE */
    .bgLove {
      position: fixed;
      width: 240px;
      opacity: 0.95;
      z-index: 40000;
      pointer-events: none;
    }

    .leftLove {
      bottom: 0;
      left: 0;
    }

    .rightLove {
      bottom: 0;
      right: 0;
    }

    .topLeftLove {
      top: 0;
      left: 0;
    }

    .topRightLove {
      top: 0;
      right: 0;
    }

    /* MAIN BOX HEART */
    .container {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80vmin;
      height: 70vmin;
      /* Heart Shape Background */
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath fill='rgba(0, 0, 0, 0.6)' d='M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      /* Flex centering for text inside the heart */
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px;
      padding-top: 80px;
      /* Push text down into wider part of heart */
      box-sizing: border-box;
      z-index: 20000;
    }

    /* HEART OUTLINE SVG */
    #heartOutline {
      position: fixed;
      top: 55%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90vmin;
      height: 90vmin;
      z-index: 10000;
      pointer-events: none;
      display: none;
      filter: drop-shadow(0 0 10px red);
    }

    /* BUTTONS */
    .buttons {
      margin-top: 30px;
      height: 160px;
      position: relative;
    }

    #yesBtn {
      font-size: 1.6rem;
      padding: 16px 38px;
      background: #ff1744;
      color: white;
      border: none;
      border-radius: 40px;
    }

    #noBtn {
      position: absolute;
      font-size: 1rem;
      padding: 10px 20px;
      background: white;
      color: #ff1744;
      border: none;
      border-radius: 40px;
    }

    /* PHOTOS */
    .photo {
      position: fixed;
      width: 200px;
      border-radius: 18px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 1.6s ease;
      border: 2px solid rgba(255, 255, 255, 0.4);
      transform: translate(-50%, -50%);
    }

    /* INITIAL POSITIONS */
    .photo:nth-of-type(1) {
      top: 15%;
      left: 15%;
    }

    .photo:nth-of-type(2) {
      top: 75%;
      left: 15%;
    }

    .photo:nth-of-type(3) {
      top: 20%;
      left: 85%;
    }

    .photo:nth-of-type(4) {
      top: 70%;
      left: 85%;
    }

    .photo:nth-of-type(5) {
      top: 45%;
      left: 10%;
    }

    .photo:nth-of-type(6) {
      top: 45%;
      left: 90%;
    }

    #successMsg {
      display: none;
      font-size: 2.2rem;
      font-weight: bold;
      margin-top: 15px;
    }

    #hiddenMsg {
      display: none;
      font-size: 1.8rem;
      margin-top: 10px;
    }

    #typing {
      display: none;
      font-size: 1.6rem;
      margin-top: 20px;
      white-space: pre-wrap;
    }

    #finalLine {
      display: none;
    }

    #finalLine {
      font-size: 2rem;
      margin-top: 25px;
      animation: heartbeat 1.2s infinite;
    }

    @keyframes heartbeat {
      0% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.1);
      }

      100% {
        transform: scale(1);
      }
    }

    /* FIREWORK */
    @keyframes explode {
      from {
        transform: scale(0);
        opacity: 1;
      }

      to {
        transform: scale(2);
        opacity: 0;
      }
    }

    /* CONFETTI */
    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: red;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      from {
        transform: translateY(-10vh);
      }

      to {
        transform: translateY(110vh);
      }
    }

    /* MOBILE RESPONSIVENESS */
    @media (max-width: 768px) {

      /* Background decorative images - smaller on mobile */
      .bgLove {
        width: 22vw;
        max-width: 100px;
      }

      /* Lock Screen (Sign-in page) */
      #lockScreen h2 {
        font-size: 1.5rem;
        margin-bottom: 15px;
        z-index: 50000;
        position: relative;
        padding: 0 20px;
      }

      .openBtn {
        padding: 14px 35px;
        font-size: 18px;
        z-index: 50000;
        position: relative;
      }

      input {
        z-index: 50000;
        position: relative;
        width: 80%;
        max-width: 280px;
      }

      /* Main container with heart shape */
      .container {
        width: 90vmin;
        height: 80vmin;
        padding: 20px;
        padding-top: 60px;
      }

      .container h1 {
        font-size: 1.4rem;
        line-height: 1.4;
      }

      /* Buttons */
      #yesBtn {
        font-size: 1.3rem;
        padding: 14px 32px;
      }

      #noBtn {
        font-size: 0.9rem;
        padding: 8px 18px;
      }

      /* Success messages */
      #successMsg {
        font-size: 1.6rem;
        margin-top: 10px;
      }

      #hiddenMsg {
        font-size: 1.3rem;
        margin-top: 8px;
      }

      /* Typing animation text */
      #typing {
        font-size: 1.1rem;
        margin-top: 15px;
        padding: 0 15px;
        line-height: 1.5;
        max-width: 90%;
        margin-left: auto;
        margin-right: auto;
      }

      /* Final line */
      #finalLine {
        font-size: 1.4rem;
        margin-top: 20px;
        padding: 0 15px;
      }

      /* Photos - smaller on mobile */
      .photo {
        width: 140px;
      }

      /* Heart outline SVG */
      #heartOutline {
        width: 95vmin;
        height: 95vmin;
      }
    }

    /* Tablet and small laptop screens */
    @media (min-width: 769px) and (max-width: 1024px) {
      .container {
        width: 75vmin;
        height: 65vmin;
      }

      .container h1 {
        font-size: 1.8rem;
      }

      #typing {
        font-size: 1.4rem;
      }

      #finalLine {
        font-size: 1.7rem;
      }

      .photo {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <img src="valentine1.jpg" class="bgLove leftLove">
  <img src="valentine2.jpg" class="bgLove rightLove">
  <img src="valentine4.jpg" class="bgLove topLeftLove">
  <img src="valentine5.jpg" class="bgLove topRightLove">

  <div id="lockScreen">
    <h2>Enter Secret Password ❤️</h2>
    <input type="password" id="pass" placeholder="Password">
    <button class="openBtn" onclick="unlock()">OPEN ❤️</button>
  </div>

  <audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
  </audio>

  <img src="photo1.jpg" class="photo" id="p1">
  <img src="photo2.jpg" class="photo" id="p2">
  <img src="photo3.jpg" class="photo" id="p3">
  <img src="photo4.jpg" class="photo" id="p4">
  <img src="photo5.jpg" class="photo" id="p5">
  <img src="photo6.jpg" class="photo" id="p6">

  <div class="container">
    <h1>Shobee Kutty, will you be my Valentine? ❤️</h1>
    <div class="buttons">
      <button id="yesBtn">YES 💖</button>
      <button id="noBtn">No 🙈</button>
    </div>

    <div id="successMsg">💘 Yaaaay!!! 💘</div>
    <div id="hiddenMsg">Happy Valentine's Day Sweet Shobee ❤️</div>
    <div id="typing"></div>
    <div id="finalLine">Will you stay with me forever? ❤️</div>
  </div>

  <!-- HEART OUTLINE -->
  <svg id="heartOutline" viewBox="0 0 24 24" fill="none" stroke="#ff0000" stroke-width="0.3">
    <path
      d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
  </svg>

  <script>

    /* MUSIC CONTROL */
    let musicPlayed = false;
    function startMusic() {
      const music = document.getElementById("bgMusic");
      if (musicPlayed) return;

      music.volume = 0;
      music.play().then(() => {
        musicPlayed = true;
        let v = 0;
        const fade = setInterval(() => {
          if (v < 0.7) { v += 0.05; music.volume = v; } else clearInterval(fade);
        }, 200);
      }).catch(() => {
        console.log("Autoplay blocked. Waiting for interaction.");
      });
    }

    /* AUTOPLAY & FOCUS */
    window.addEventListener('load', () => {
      startMusic();
      const p = document.getElementById("pass");
      if (p) p.focus();
    });
    document.addEventListener('click', startMusic);
    document.addEventListener('keydown', startMusic);

    /* PASSWORD */
    function unlock() {
      const entered = document.getElementById("pass").value.toLowerCase().trim();
      if (entered === "bajitos") {
        document.getElementById("lockScreen").style.display = "none";
        startMusic();
      } else {
        alert("Wrong password Bajitos!!! 😜");
      }
    }

    /* HEART FLOAT */
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerHTML = "❤️";
      h.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 6000);
    }, 400);

    /* NO FLOAT */
    noBtn.onmouseover = noBtn.ontouchstart = () => {
      noBtn.style.left = Math.random() * (window.innerWidth - 100) + "px";
      noBtn.style.top = Math.random() * (window.innerHeight - 100) + "px";
    };

    /* YES CLICK */
    yesBtn.onclick = () => {
      document.querySelector("h1").style.display = "none";
      document.querySelector(".buttons").style.display = "none";
      document.querySelector(".container").style.background = "none";
      successMsg.style.display = "block";
      hiddenMsg.style.display = "block";

      fireworks();
      confetti();
      navigator.vibrate([200, 100, 200]);
      heartLayout();
      showPromise();
    };

    /* FIREWORK */
    function fireworks() {
      for (let i = 0; i < 30; i++) {
        const f = document.createElement("div");
        f.innerHTML = "✨";
        f.style.position = "fixed";
        f.style.left = Math.random() * 100 + "vw";
        f.style.top = Math.random() * 100 + "vh";
        f.style.fontSize = "24px";
        f.style.animation = "explode 1s ease-out forwards";
        document.body.appendChild(f);
        setTimeout(() => f.remove(), 1000);
      }
    }

    /* CONFETTI */
    function confetti() {
      for (let i = 0; i < 40; i++) {
        const c = document.createElement("div");
        c.className = "confetti";
        c.style.left = Math.random() * 100 + "vw";
        c.style.background = `hsl(${Math.random() * 360},80%,60%)`;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 3000);
      }
    }

    /* HEART LAYOUT */
    function heartLayout() {
      // Show Outline
      document.getElementById("heartOutline").style.display = "block";

      // Photos on Border (Adjusted for 90vmin SVG centered at 55% top)
      p1.style.top = "25%"; p1.style.left = "25%";
      p2.style.top = "25%"; p2.style.left = "75%";
      p3.style.top = "50%"; p3.style.left = "10%";
      p4.style.top = "50%"; p4.style.left = "90%";
      p5.style.top = "80%"; p5.style.left = "35%";
      p6.style.top = "80%"; p6.style.left = "65%";
    }


    /* PROMISE */
    function showPromise() {
      const text = `I promise to be your peace when the world feels heavy,
and your strength when your heart feels tired…
always, forever, yours — Shobee. ❤️`;

      typing.style.display = "block";
      let i = 0;
      (function type() {
        if (i < text.length) {
          typing.innerHTML += text.charAt(i++);
          setTimeout(type, 40);
        } else {
          setTimeout(() => {
            document.body.classList.add("darkMode");
            finalLine.style.display = "block";
          }, 1500);
        }
      })();
    }

  </script>

</body>

</html>
